<svg xmlns="http://www.w3.org/2000/svg" width="760mm" height="600mm" viewBox="0 0 760 600" font-family="sans-serif">
<title>Rifter XL - foam cuts for the 14S4P 21700 pack (1:1, mm)</title>
<defs><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3ecb0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b9a400" stroke-width="1"/></pattern></defs>
<rect width="760" height="600" fill="#fff"/>
<text x="20" y="22" font-size="11" text-anchor="start" font-weight="bold">1. Where the foam sits (bag interior, seen from the side)</text>
<g transform="translate(20,40)">
<polygon points="0.0,0.0 229.0,0.0 229.0,136.1 202.7,152.0 0.0,152.0" fill="#cfe8cf" stroke="#222" stroke-width="0.7" />
<polygon points="229.0,0.0 455.0,0.0 229.0,136.1" fill="#cfdcf2" stroke="#222" stroke-width="0.7" />
<polygon points="0.0,152.0 202.7,152.0 0.0,274.0" fill="#f6d9b8" stroke="#222" stroke-width="0.7" />
<polygon points="455.0,0.0 480.0,0.0 480.0,90.0 457.7,103.4 411.3,26.3" fill="url(#h)" stroke="#222" stroke-width="0.7" />
<polygon points="0.0,274.0 68.6,232.6 115.0,309.7 93.0,323.0 0.0,323.0" fill="url(#h)" stroke="#222" stroke-width="0.7" />
<polygon points="457.7,103.4 115.0,309.7 109.8,301.1 452.6,94.8" fill="url(#h)" stroke="#222" stroke-width="0.7" />
<polygon points="452.6,94.8 411.3,26.3 68.6,232.6 109.8,301.1" fill="#bdbdbd" stroke="#222" stroke-width="0.7" />
<polygon points="0,0 480,0 480,90 93,323 0,323" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="70" y="80" font-size="11" text-anchor="start" font-weight="bold">BLOCK 1</text>
<text x="70" y="94" font-size="8" text-anchor="start">whole, corner trimmed</text>
<text x="262" y="45" font-size="11" text-anchor="start" font-weight="bold">PIECE 2a</text>
<text x="262" y="59" font-size="8" text-anchor="start">226 along top x 136 down</text>
<text x="14" y="196" font-size="11" text-anchor="start" font-weight="bold">PIECE 2b</text>
<text x="14" y="210" font-size="8" text-anchor="start">203 along top</text>
<text x="14" y="222" font-size="8" text-anchor="start">x 122 down</text>
<text x="262" y="172" font-size="10" text-anchor="middle" font-weight="bold" transform="rotate(-31 262 172)">14S4P PACK (assumed 80 x 400)</text>
<text x="300" y="222" font-size="8" text-anchor="middle" transform="rotate(-31 300 222)">10 mm pad under pack</text>
<text x="486" y="40" font-size="8" text-anchor="start">end fill</text>
<text x="486" y="51" font-size="8" text-anchor="start">(block 3)</text>
<text x="8" y="300" font-size="8" text-anchor="start">end fill</text>
<text x="8" y="311" font-size="8" text-anchor="start">(block 3)</text>
<text x="240" y="-6" font-size="8" text-anchor="middle">top tube edge 480</text>
<text x="-6" y="160" font-size="8" text-anchor="middle" transform="rotate(-90 -6 160)">seat tube edge 323</text>
<text x="330" y="290" font-size="8" text-anchor="middle" transform="rotate(-31 330 290)">down tube edge</text>
</g>
<text x="20" y="400" font-size="11" text-anchor="start" font-weight="bold">2. How to cut the blocks (each block face is 229 x 152; the 76 mm thickness goes across the bag)</text>
<g transform="translate(20,420)">
<polygon points="0.0,0.0 229.0,0.0 229.0,136.1 202.7,152.0 0.0,152.0" fill="#cfe8cf" stroke="#222" stroke-width="0.7" />
<rect width="229" height="152" fill="none" stroke="#222" stroke-width="0.7"/>
<line x1="229" y1="136.1" x2="202.7" y2="152" stroke="#c00" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="60" y="70" font-size="11" text-anchor="start" font-weight="bold">BLOCK 1</text>
<text x="60" y="84" font-size="8" text-anchor="start">cut off one corner:</text>
<text x="60" y="96" font-size="8" text-anchor="start">26 along x 16 up</text>
</g>
<g transform="translate(265,420)">
<rect width="229" height="152" fill="#eee" stroke="#222" stroke-width="0.7"/>
<polygon points="0.0,0.0 226.0,0.0 0.0,136.1" fill="#cfdcf2" stroke="#222" stroke-width="0.7" />
<polygon points="229.0,152.0 26.3,152.0 229.0,30.0" fill="#f6d9b8" stroke="#222" stroke-width="0.7" />
<line x1="226" y1="0" x2="0" y2="136.1" stroke="#c00" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="26.3" y1="152" x2="229" y2="30" stroke="#c00" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="22" y="40" font-size="12" text-anchor="start" font-weight="bold">2a</text>
<text x="22" y="54" font-size="8" text-anchor="start">226 x 136</text>
<text x="160" y="120" font-size="12" text-anchor="start" font-weight="bold">2b</text>
<text x="150" y="134" font-size="8" text-anchor="start">203 x 122</text>
<text x="120" y="84" font-size="7" text-anchor="middle" transform="rotate(-31 120 84)">offcut strip</text>
</g>
<g transform="translate(510,420)">
<rect width="229" height="152" fill="url(#h)" stroke="#222" stroke-width="0.7"/>
<line x1="0" y1="10" x2="229" y2="10" stroke="#c00" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="0" y1="20" x2="229" y2="20" stroke="#c00" stroke-width="1.2" stroke-dasharray="5 3"/>
<rect x="30" y="52" width="170" height="62" fill="#fff" opacity="0.85"/>
<text x="38" y="66" font-size="11" text-anchor="start" font-weight="bold">BLOCK 3</text>
<text x="38" y="80" font-size="8" text-anchor="start">two 10 mm slices = pad under pack</text>
<text x="38" y="92" font-size="8" text-anchor="start">rest = the two end fills,</text>
<text x="38" y="104" font-size="8" text-anchor="start">cut to fit</text>
</g>
<text x="20" y="590" font-size="8" text-anchor="start">Red dashed = cut lines. Pack size is an assumption: trace your real pack on the cardboard and trim the slanted edges to that line. Leave foam ~5 mm oversize.</text>
<line x1="560" y1="330" x2="660" y2="330" stroke="#000"/><line x1="560" y1="326" x2="560" y2="334" stroke="#000"/><line x1="660" y1="326" x2="660" y2="334" stroke="#000"/>
<text x="610" y="324" font-size="8" text-anchor="middle">100 mm print check</text>
</svg>